services:
  mysql:
    image: ${MYSQL_IMAGE}
    container_name: myoj-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${BIND_IP}:${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [myoj-infra]

  redis:
    image: ${REDIS_IMAGE}
    container_name: myoj-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "${BIND_IP}:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [myoj-infra]

  nacos:
    image: ${NACOS_IMAGE}
    container_name: myoj-nacos
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_SYSTEM_TYPE: nacos
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: ${NACOS_JVM_XMS}
      JVM_XMX: ${NACOS_JVM_XMX}
      JVM_XMN: ${NACOS_JVM_XMN}
    ports:
      - "${BIND_IP}:${NACOS_PORT}:8848"
      - "${BIND_IP}:${NACOS_GRPC_PORT}:9848"
      - "${BIND_IP}:${NACOS_GRPC_CLIENT_PORT}:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks: [myoj-infra]

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    container_name: myoj-rabbitmq
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    command:
      - /bin/sh
      - -c
      - rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_prometheus && exec rabbitmq-server
    ports:
      - "${BIND_IP}:${RABBITMQ_PORT}:5672"
      - "${BIND_IP}:${RABBITMQ_MANAGEMENT_PORT}:15672"
      - "${BIND_IP}:${RABBITMQ_PROMETHEUS_PORT}:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [myoj-infra]

  minio:
    image: ${MINIO_IMAGE}
    container_name: myoj-minio
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_BIND_IP}:${MINIO_PORT}:9000"
      - "${MINIO_BIND_IP}:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [myoj-infra]

  minio-init:
    image: ${MINIO_MC_IMAGE}
    container_name: myoj-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set download "local/$${MINIO_BUCKET}"
    networks: [myoj-infra]

networks:
  myoj-infra:
    name: myoj-infra

volumes:
  mysql-data:
    name: myoj-mysql-data
  redis-data:
    name: myoj-redis-data
  nacos-data:
    name: myoj-nacos-data
  nacos-logs:
    name: myoj-nacos-logs
  rabbitmq-data:
    name: myoj-rabbitmq-data
  minio-data:
    name: myoj-minio-data
