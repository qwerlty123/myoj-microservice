global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: myoj-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8101"]

  - job_name: myoj-user-service
    metrics_path: /api/user/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8102"]

  - job_name: myoj-question-service
    metrics_path: /api/question/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8103"]

  - job_name: myoj-judge-service
    metrics_path: /api/judge/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8104"]

  - job_name: myoj-comment-service
    metrics_path: /api/comment/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8105"]

  - job_name: myoj-ai-service
    metrics_path: /api/ai/actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8106"]

  - job_name: myoj-codesandbox
    metrics_path: /actuator/prometheus
    static_configs:
      # Code Sandbox is deployed on the same remote server as the middleware.
      - targets: ["124.221.250.220:8090"]

  - job_name: rabbitmq
    # The aggregate /metrics endpoint has no queue label, so it mixes the
    # judge queue with DLQs. Per-object metrics let the dashboard isolate
    # code_queue during judge load tests.
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["124.221.250.220:15692"]
