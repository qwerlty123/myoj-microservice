spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  cloud:
    nacos:
      discovery:
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}

myoj:
  security:
    gateway-token: ${GATEWAY_TRUST_TOKEN}
  ai:
    sandbox:
      url: ${CODESANDBOX_URL}
      secret-key: ${CODESANDBOX_SECRET_KEY}
