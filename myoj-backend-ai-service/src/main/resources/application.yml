spring:
  application:
    name: myoj-backend-ai-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/myoj?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${AI_DB_MAX_POOL_SIZE:8}
      minimum-idle: ${AI_DB_MIN_IDLE:1}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  ai:
    retry:
      max-attempts: 1
    openai:
      api-key: ${AI_CHAT_API_KEY:}
      chat:
        base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
        api-key: ${AI_CHAT_API_KEY:}
        options:
          model: ${AI_CHAT_MODEL:deepseek-v4-flash}
          temperature: 0.2
    tools:
      observations:
        include-content: false
    chat:
      observations:
        log-prompt: false
        log-completion: false

server:
  address: 0.0.0.0
  port: 8106
  servlet:
    context-path: /api/ai

myoj:
  security:
    gateway-token: ${GATEWAY_TRUST_TOKEN:change-me-gateway-token}
  ai:
    timeout: 10m
    max-prompt-length: 2000
    max-steps: 10
    memory-size: 16
    chat:
      enabled: ${AI_CHAT_ENABLED:true}
      retention-days: ${AI_CHAT_RETENTION_DAYS:30}
      timeout: ${AI_CHAT_STREAM_TIMEOUT:30m}
      max-history-messages: ${AI_CHAT_MAX_HISTORY_MESSAGES:20}
      max-message-length: 4000
      max-user-code-length: 40000
      agent-max-steps: ${AI_CHAT_AGENT_MAX_STEPS:4}
      agent-max-decision-retries: 2
      max-observation-chars: 1200
      archive-cron: ${AI_CHAT_ARCHIVE_CRON:0 0/30 * * * ?}
    authoring:
      enabled: ${AI_AUTHORING_ENABLED:true}
      max-repair-count: ${AI_AUTHORING_MAX_REPAIR_COUNT:3}
      stale-after: ${AI_AUTHORING_STALE_AFTER:3m}
      recovery-cron: ${AI_AUTHORING_RECOVERY_CRON:0 */1 * * * ?}
      page-size-limit: ${AI_AUTHORING_PAGE_SIZE_LIMIT:50}
      graph-version: ${AI_AUTHORING_GRAPH_VERSION:authoring-v2-hitl}
      prompt-version: ${AI_AUTHORING_PROMPT_VERSION:authoring-v1}
      checkpoint:
        host: ${REDIS_HOST:127.0.0.1}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:}
        database: ${AI_AUTHORING_REDIS_DATABASE:1}
    executor:
      core-size: ${AI_AGENT_CORE_THREADS:2}
      max-size: ${AI_AGENT_MAX_THREADS:8}
      queue-capacity: ${AI_AGENT_QUEUE_CAPACITY:50}
    chat-executor:
      core-size: ${AI_CHAT_CORE_THREADS:8}
      max-size: ${AI_CHAT_MAX_THREADS:8}
      queue-capacity: ${AI_CHAT_QUEUE_CAPACITY:32}
    sandbox:
      url: ${CODESANDBOX_URL:http://localhost:8090/executeCode}
      secret-key: ${CODESANDBOX_SECRET_KEY:}
      connect-timeout: 3s
      read-timeout: 120s
      max-cases: 12
      max-code-length: 40000
    search:
      api-url: ${BAIDU_AI_SEARCH_URL:https://qianfan.baidubce.com/v2/ai_search/chat/completions}
      api-key: ${BAIDU_AI_SEARCH_API_KEY:}
      timeout: 8s
      max-results: 5
    crawler:
      timeout: 8s
      max-body-bytes: 512000
      max-text-length: 12000
      allowed-hosts:
        - leetcode.cn

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.ai.chat.client.advisor: INFO
