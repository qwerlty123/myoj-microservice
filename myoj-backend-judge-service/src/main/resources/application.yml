spring:
  application:
    name: myoj-backend-judge-service
  #  # Spring Cloud 2021.x 需显式声明 Nacos 配置导入（不需要从 Nacos 拉取配置时用 optional）
  #  config:
  #    import:
  #      - "optional:nacos:application.yml"
  # 默认 dev 环境
  profiles:
    active: dev
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://124.221.250.220:3306/myoj
    username: admin
    password: adgjl08642
  # Redis 配置
  # todo 需替换配置，然后取消注释
  #  redis:
  #    database: 1
  #    host: localhost
  #    port: 6379
  #    timeout: 5000
  #    password: 123456
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
  #  elasticsearch:
  #    uris: http://localhost:9200
  #    username: root
  #    password: 123456
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
  cloud:
    nacos:
      # Nacos 开启鉴权时必填
      username: nacos
      password: adgjl08642
      discovery:
        server-addr: 124.221.250.220:8848
  rabbitmq:
    host: 124.221.250.220
    port: 5672
    username: admin
    password: adgjl08642
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 5000ms
server:
  address: 0.0.0.0
  port: 8104
  servlet:
    context-path: /api/judge
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.qwerlty.myojbackendjudgeservice.controller
#代码沙箱配置
codesandbox:
  type: remote
  # 远程沙箱地址（使用 remote 时生效）
  url: ${CODESANDBOX_URL:http://localhost:8090/executeCode}
  # 与沙箱共享的密钥，用于 API 签名认证，请与沙箱配置保持一致并妥善保管
  secretKey: ${CODESANDBOX_SECRET_KEY:}

management:
  # 当前部署未启用 Elasticsearch，避免 Actuator 探测本机 9200 导致健康状态告警。
  health:
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
