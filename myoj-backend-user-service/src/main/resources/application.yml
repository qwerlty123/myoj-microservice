    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
# 用户头像上传 MinIO 配置（与 MinioConfiguration 的 file.minio 前缀对应）
file:
  minio:
    accessKey: admin
    secretKey: adgjl08642
    endpoint: http://124.221.250.220:9002
    bucket: myoj
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.qwerlty.myojbackenduserservice.controller
#代码沙箱配置
codesandbox:
  type: remote
  # 远程沙箱地址（使用 remote 时生效）
  url: http://localhost:8090/executeCode
  # 与沙箱共享的密钥，用于 API 签名认证，请与沙箱配置保持一致并妥善保管
  secretKey: adgjl08642

management:
  # 当前部署未启用 Elasticsearch，避免 Actuator 探测本机 9200 导致健康状态告警。
  health:
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
